<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Job Application Tracker</title>
</head>
<body class="bg-[#F1F5F9]">

    <header class=" w-[80%] mx-auto">
        <h1 class=" text-green-500 text-4xl font-bold " > Job Application Tracker</h1>
        <div class="menu-divs grid grid-cols-3 gap-8 mt-8 ">
            <div class="total-count bg-white p-4 border-0 rounded-md ">
                <p class="total-count-text text-2xl font-bold">Total</p>
                <p class="total-count tex-xl font-bold">0</p>
            </div>

            <div class="total-interview bg-white p-4 border-0 rounded-md">
                <p class="total-interview-text text-2xl font-bold">Interview</p>
                <p class="total-interview tex-xl font-bold ">0</p>
            </div>

            <div class="total-rejected bg-white p-4 border-0 rounded-md">
                <p class="total-rejected-text text-2xl font-bold">Rejected</p>
                <p class="total-rejected tex-xl font-bold">0</p>
            </div>
        </div>

    </header>
    <main>

<div class=" w-[80%] mx-auto mt-10 flex flex-wrap gap-2 mb-5 ">
    <button class="px-5 py-1.5 rounded-full border-2 text-sm font-medium cursor-pointer transition-all duration-200">
        All
    </button>

    <button class="px-5 py-1.5 rounded-full border-2 text-sm font-medium cursor-pointer transition-all duration-200">
        Interview
    </button>

    <button class="px-5 py-1.5 rounded-full border-2 text-sm font-medium cursor-pointer transition-all duration-200">
        Rejected
    </button>
</div>
   
<!-- Job Card -->

 <section class=" w-[80%] mx-auto ">
        <div class="card bg-white rounded-2xl border-2 border-slate-100 px-6 py-5 ">
            
            <div class="flex justify-between  gap-4">
                
                <!-- Left Div -->
                <div class="flex-1 min-w-0">
                    <p class="font-syne font-bold text-navy text-base mb-0.5">
                        Mobile First Corp
                    </p>

                    <p class="text-sm text-slate-500 mb-2">
                        React Native Developer
                    </p>

                    <p class="text-xs text-slate-400 mb-3">
                        <span>Remote</span>
                        <span class="mx-1.5">•</span>
                        <span>Full-time</span>
                        <span class="mx-1.5">•</span>
                        <span>$130,000 - $175,000</span>
                    </p>

                    <div
                    class="mb-3 inline-block text-[0.65rem] font-bold tracking-widest uppercase px-3 py-1 rounded-full bg-slate-200 text-slate-500">
                    Not Applied
                    </div>
                
                    <p class="text-xs text-slate-500 leading-relaxed mb-4">
                    Build cross-platform mobile applications using React Native.
                    Work on products used by millions of users worldwide.
                    </p>

                    <div class="flex flex-wrap gap-2">
                    <button
                    class="text-xs font-semibold px-4 py-1.5 rounded-md border-2 border-teal text-teal bg-transparent cursor-pointer transition-all duration-150 hover:bg-teal hover:text-white">
                    Interview
                    </button>

                    <button
                    class="text-xs font-semibold px-4 py-1.5 rounded-md border-2 border-coral text-coral bg-transparent cursor-pointer transition-all duration-150 hover:bg-coral hover:text-white">
                    Rejected
                    </button>
                    </div>
                
                </div>

                <div class="delete">
                    <button class="delete btn text-white bg-red-600 px-10 py-4 rounded-2xl"> Delete</button>
                </div>
        
        </div>

        
    </section>
    </main>
  <script src="./script.js"></script>  
</body>
</html>
